openapi: 3.0.3
info:
  title: Diting Local Console API
  version: 1.0.0
  description: |
    HTTP API of the Diting local voice recording console. All endpoints bind
    to loopback addresses only, and write operations require same-origin
    requests. This version exposes both the /api/ and /api/v1/ prefixes with
    identical behavior; new consumers should use /api/v1/.
    Chinese version: api/openapi.yaml.
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: Local loopback address
paths:
  /status:
    get:
      summary: Get running state
      responses:
        '200':
          description: Current listening state and statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /stats:
    get:
      summary: Full archive statistics
      responses:
        '200':
          description: Recording count, total size, transcript characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
  /days:
    get:
      summary: Daily archive statistics
      responses:
        '200':
          description: Segments, characters, recordings, and size per day
          content:
            application/json:
              schema:
                type: object
                properties:
                  days:
                    type: array
                    items:
                      $ref: '#/components/schemas/DayStat'
  /days/{date}/minutes:
    post:
      summary: Generate and save Markdown meeting minutes for a date
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        '200':
          description: Date, transcript segment count, Markdown minutes, and generation time; minutes persist to data/minutes and can be reopened via GET at any time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayMinutesResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      summary: Read saved meeting minutes for a date
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        '200':
          description: Saved meeting minutes; no model call
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayMinutesResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No generated meeting minutes for that day yet (MINUTES_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /days/{date}/topics:
    post:
      summary: Reclassify topics for a date with the current model
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        '200':
          description: Transcript count and topic rebuild statistics; only derived paragraphs change, original transcripts remain unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayTopicsResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /days/{date}:
    delete:
      summary: Delete a day's data (dry-run supported)
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: dryRun
          in: query
          schema:
            type: boolean
            default: false
          description: When true, return an impact preview only without deleting
      responses:
        '200':
          description: Deletion result or preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayDeleteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /speakers:
    get:
      summary: Speaker list
      responses:
        '200':
          description: Stable labels, display names, and counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpeakerView'
  /speakers/samples:
    get:
      summary: Latest sample sentence per stable voiceprint label
      description: Returns labels in speaker registry order; the sample is the label's most recent recording with a non-empty transcript, and sample is omitted when none is available.
      responses:
        '200':
          description: Voiceprint labels with sample sentences and playable recordings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SpeakerSample'
        '500':
          description: Unable to read voiceprint samples
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /speakers/{label}:
    patch:
      summary: Set a speaker alias
      parameters:
        - name: label
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alias:
                  type: string
                  maxLength: 32
      responses:
        '200':
          description: Updated speaker list
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /speakers/{label}/merge:
    put:
      summary: Merge or unmerge speakers
      parameters:
        - name: label
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
                  description: Target stable label; empty string unmerges
      responses:
        '200':
          description: Updated speaker list
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /lexicon:
    get:
      summary: Read the domain lexicon
      responses:
        '200':
          description: Current lexicon rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lexicon'
    put:
      summary: Atomically replace the domain lexicon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Lexicon'
      responses:
        '200':
          description: Updated lexicon
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /settings:
    get:
      summary: Read current settings
      responses:
        '200':
          description: Paragraph model, semantic correction, and ASR selection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
    put:
      summary: Update settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: Updated settings
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /models:
    get:
      summary: List models available at the current endpoint
      responses:
        '200':
          description: Model ID list
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      type: string
  /paragraphs:
    get:
      summary: Current preview paragraph list
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 500
        - name: date
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        '200':
          description: Paragraph metadata list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParagraphMeta'
  /paragraphs/split:
    post:
      summary: Re-split the recent window by topic
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  default: 500
      responses:
        '200':
          description: Re-split statistics
        '403':
          $ref: '#/components/responses/Forbidden'
  /paragraphs/correct:
    post:
      summary: Manually correct derived paragraphs in the recent window
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  default: 500
      responses:
        '200':
          description: Correction statistics
        '403':
          $ref: '#/components/responses/Forbidden'
  /paragraphs/{id}/correct:
    post:
      summary: Correct a specific paragraph
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Correction statistics
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /paragraphs/{id}/asr:
    post:
      summary: Re-recognize a specific paragraph with the current ASR
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Re-recognition statistics
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /paragraphs/{id}/summarize:
    post:
      summary: Generate a standalone digest for a specific paragraph
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Digest content
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /capture:
    put:
      summary: Idempotent microphone start/stop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: string
                  enum: [RUNNING, STOPPED]
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /segments:
    get:
      summary: Reverse-chronological history segments
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: before
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Segment list and pagination cursor
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SegmentView'
                  nextBefore:
                    type: string
  /segments/{id}:
    delete:
      summary: Delete one record and update merged transcripts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deletion result; the recording moves to the Trash, intersecting derived paragraphs are removed, and a rebuild is triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentDeleteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /segments/delete:
    post:
      summary: Batch-delete records and update merged transcripts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
      responses:
        '200':
          description: Deletion results; recordings move to the Trash, intersecting derived paragraphs are removed, and a rebuild is triggered; nonexistent IDs are skipped
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        trashPath:
                          type: string
                  removedParagraphs:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /segments/{id}/audio:
    get:
      summary: Read a segment's recording
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Audio file content
          content:
            audio/mp4: {}
            audio/wav: {}
        '404':
          $ref: '#/components/responses/NotFound'
  /markdown:
    get:
      summary: Merged Markdown transcript
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 500
        - name: date
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: download
          in: query
          schema:
            type: boolean
        - name: lang
          in: query
          description: Language of fixed transcript labels; original transcript content is unaffected
          schema:
            type: string
            enum: [zh, en]
            default: zh
      responses:
        '200':
          description: Markdown text
          content:
            text/markdown: {}
  /events:
    get:
      summary: Server-Sent Events real-time stream
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream: {}
components:
  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Invalid request origin
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    StatusResponse:
      type: object
      properties:
        state:
          type: string
          enum: [STOPPED, RUNNING, STOPPING]
        startedAt:
          type: string
          format: date-time
        segmentCount:
          type: integer
        droppedChunks:
          type: integer
        lastError:
          type: string
        uptimeSeconds:
          type: integer
    StatsResponse:
      type: object
      properties:
        audioFiles:
          type: integer
        audioBytes:
          type: integer
        segments:
          type: integer
        transcriptChars:
          type: integer
        updatedAt:
          type: string
          format: date-time
    DayStat:
      type: object
      properties:
        date:
          type: string
        segments:
          type: integer
        chars:
          type: integer
        audioFiles:
          type: integer
        audioBytes:
          type: integer
        minutes:
          type: boolean
          description: Whether generated meeting minutes are saved for that day
    DayDeleteResponse:
      type: object
      properties:
        date:
          type: string
        segments:
          type: integer
        audioFiles:
          type: integer
        audioBytes:
          type: integer
        trashPath:
          type: string
        snapshot:
          type: string
        dryRun:
          type: boolean
        removedParagraphs:
          type: integer
    DayMinutesResult:
      type: object
      properties:
        date:
          type: string
          format: date
        segments:
          type: integer
        markdown:
          type: string
          description: Daily meeting minutes in Markdown format
        generatedAt:
          type: string
          format: date-time
          description: Minutes generation time
    DayTopicsResult:
      type: object
      properties:
        date:
          type: string
          format: date
        segments:
          type: integer
        runs:
          type: integer
        llm:
          type: integer
        single:
          type: integer
        fallback:
          type: integer
        paragraphs:
          type: integer
    SpeakerView:
      type: object
      properties:
        label:
          type: string
        name:
          type: string
        mergedInto:
          type: string
        count:
          type: integer
        updatedAt:
          type: string
          format: date-time
    SpeakerSample:
      type: object
      properties:
        label:
          type: string
          description: Stable voiceprint label
        sample:
          allOf:
            - $ref: '#/components/schemas/SegmentView'
          nullable: true
          description: Most recent recording with a non-empty transcript; omitted when no sample is available
    Lexicon:
      type: object
      properties:
        version:
          type: integer
        rules:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
              to:
                type: string
    Settings:
      type: object
      properties:
        model:
          type: string
        correct:
          type: boolean
        asr:
          type: string
          enum: [local, mimo]
    ParagraphMeta:
      type: object
      properties:
        id:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        speaker:
          type: string
        segmentCount:
          type: integer
        source:
          type: string
        category:
          type: string
          description: Major topic category; may be empty for old data
        title:
          type: string
          description: Short minor topic title
        summary:
          type: string
          description: Concise summary, may contain inline Markdown
        hasTopic:
          type: boolean
        fillerOnly:
          type: boolean
          description: Whether the paragraph contains only filler utterances; intended for display filtering without changing transcripts
    SegmentDeleteResponse:
      type: object
      properties:
        id:
          type: string
        trashPath:
          type: string
        removedParagraphs:
          type: integer
    SegmentView:
      type: object
      properties:
        id:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
        text:
          type: string
        speaker:
          type: string
        speakerName:
          type: string
        audioPath:
          type: string